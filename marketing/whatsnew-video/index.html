<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Headroom — what's new</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  body { -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050507; }
  .layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .headline, .callout, .tooltip, .panel, .menubar, .pill { transform-style: flat; }
  #controls { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: rgba(0,0,0,0.8); color: #ddd; font: 13px -apple-system, sans-serif; gap: 12px; align-items: center; }
  .preview #controls { display: flex; }
  .preview #stage { transform-origin: 0 0; }
  #scrub { flex: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="controls"><button id="play">Play</button><input id="scrub" type="range" min="0" max="45" step="0.001" value="0"><span id="time">0.00</span></div>
<script type="module">
  // Preview: index.html?preview scrubs and plays with the mastered soundtrack (out/audio.wav) when present.
  const preview = new URLSearchParams(location.search).has("preview");
  if (preview) document.body.classList.add("preview");
  await document.fonts.ready;
  await import("./scenes.js");
  const img = document.querySelector("img");
  if (img && !img.complete) await new Promise((r) => { img.onload = r; img.onerror = r; });
  if (img) await img.decode().catch(() => {});
  window.__render(0);
  window.__loaded = true;
  if (preview) {
    const stage = document.getElementById("stage");
    const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 44) / 1080); stage.style.transform = `scale(${s})`; };
    fit(); addEventListener("resize", fit);
    const scrub = document.getElementById("scrub"), time = document.getElementById("time"), play = document.getElementById("play");
    const audio = new Audio("out/audio.wav");
    let playing = false, t0 = 0, start = 0;
    const draw = (t) => { window.__render(t); scrub.value = t; time.textContent = t.toFixed(2); };
    scrub.oninput = () => { if (playing) { audio.currentTime = +scrub.value; start = performance.now(); t0 = +scrub.value; } draw(+scrub.value); };
    play.onclick = () => {
      playing = !playing; play.textContent = playing ? "Pause" : "Play";
      if (playing) { t0 = +scrub.value; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => {}); requestAnimationFrame(loop); } else audio.pause();
    };
    const loop = () => { if (!playing) return; const t = t0 + (performance.now() - start) / 1000; if (t >= 45) { playing = false; play.textContent = "Play"; return; } draw(t); requestAnimationFrame(loop); };
  }
</script>
</body>
</html>
